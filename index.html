<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>หมู่บ้านโลว์โพลี</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfd9ee;font-family:'Noto Sans Thai','Sarabun',system-ui,sans-serif;user-select:none;color:#1b2b4b}
canvas{display:block;touch-action:none}button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:5px 10px;background:#2d5fc4;color:#fff}button:disabled{cursor:not-allowed;opacity:.55}
#top{position:fixed;top:0;left:0;right:0;padding:env(safe-area-inset-top,0px) 8px 0;display:none;gap:6px;flex-wrap:wrap;background:#1b2b4bdd;color:#fff;font-size:14px;align-items:center;min-height:40px;box-shadow:0 2px 8px #0005;z-index:4}
#hud span{display:inline-block;margin:2px 3px;padding:2px 8px;background:#ffffff22;border-radius:6px}
#menu{position:fixed;right:0;top:56px;width:224px;background:#f4f7fbee;padding:8px;border-radius:10px 0 0 10px;display:none;grid-template-columns:1fr 1fr;gap:6px;max-height:calc(100% - 72px);overflow:auto;box-shadow:0 2px 10px #0004;z-index:3}
#menu button{background:#fff;color:#1b2b4b;border:2px solid #2d5fc4;display:flex;flex-direction:column;align-items:center;font-size:13px}
#pn{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#f4f7fbee;padding:10px;border-radius:10px;display:none;max-width:340px;max-height:60%;overflow:auto;font-size:14px;box-shadow:0 2px 10px #0004;z-index:3}
#pn button{margin:2px;text-shadow:0 1px 2px #000a}#pn select{font:inherit}
#ts{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;z-index:6}
#ts div{background:#1b2b4bee;color:#fff;padding:6px 14px;border-radius:8px;font-size:14px}
#box{position:fixed;border:1px solid #fff;background:#3b82f633;display:none;pointer-events:none}
.lb{position:fixed;transform:translate(-50%,-50%);background:#1b2b4bcc;color:#fff;padding:1px 7px;border-radius:8px;font-size:12px;pointer-events:none}
#zb{position:fixed;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:6px;z-index:3}#zb button{width:46px;height:46px;font-size:17px}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#bfd9ee,#7cc35a)}
.card{background:#fff;padding:22px;border-radius:14px;width:300px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px #0004}
.card h2{margin:0;text-align:center}.card input{font:inherit;padding:8px;border:2px solid #c9d6ee;border-radius:6px}
#er{color:#c0392b;min-height:18px;margin:0;font-size:13px}.tabs{display:flex;gap:6px}.tabs button{flex:1;background:#c9d6ee;color:#1b2b4b}.tabs .on{background:#2d5fc4;color:#fff}
#devh{font-size:12px;background:#eef3fb;border-radius:8px;padding:8px;margin:0}

 hall:{n:'ศาลากลาง',ic:I(BIC.hall),s:3,h:1.4,roof:0x1e3f8a,c:{},d:'จัดการอาชีพชาวบ้านทุกคน'},

/* ===== เลือกอุปกรณ์: มือถือ / คอม ===== */
let dev=+(st.get('rts_dev')||0);

function tab(n){mode=n;$('t0').className=n?'':'on';$('t1').className=n?'on':'';$('iu').placeholder=n?'อีเมล Gmail':'ชื่อผู้เล่น';$('er').textContent=''}
function auth(reg){const u=$('iu').value.trim(),p=$('ip').value,e=m=>$('er').textContent=m;

 const id=(mode?'g:':'n:')+u.toLowerCase(),us=JSON.parse(st.get('rts_u')||'{}');
 if(reg){if(us[id])return e(mode?'อีเมลนี้ถูกใช้แล้ว':'ชื่อนี้ถูกใช้แล้ว');if(p.length<4)return e('รหัสผ่านต้องมี 4 ตัวขึ้นไป');us[id]=H(id+'|'+p);st.set('rts_u',JSON.stringify(us))}
 else{if(!us[id])return e('ไม่พบบัญชีนี้');if(us[id]!==H(id+'|'+p))return e('รหัสผ่านไม่ถูกต้อง')}
 $('ip').value='';e('');start(id)}

 else wander(v,dt)}
